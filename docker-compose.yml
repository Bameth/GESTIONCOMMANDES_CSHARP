version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=dpg-culapsdds78s73bos080-a;Port=5432;Database=gestion_commandes_csharp;Username=gestion_commandes_csharp_user;Password=DEF1ptoMAYTlVGuke6avIvGIRwUcxaBp;
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3


  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: gestion_commandes_csharp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
